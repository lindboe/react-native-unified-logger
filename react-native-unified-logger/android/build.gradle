buildscript {
  // Prefer the host app's root `ext` values; fall back to android/gradle.properties.
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["UnifiedLogger_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // When built inside an app, the root project's classpath (AGP + Kotlin from the
    // React Native Gradle plugin setup) takes precedence over these.
    classpath "com.android.tools.build:gradle:${getExtOrDefault('agpVersion')}"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// Runs codegen for this library (NativeUnifiedLoggerSpec.java) before compilation and
// adds build/generated/source/codegen/java to the main source set.
apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return getExtOrDefault(name).toInteger()
}

android {
  namespace = "com.unifiedlogger"

  compileSdk = getExtOrIntegerDefault("compileSdkVersion")
  ndkVersion = getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdk = getExtOrIntegerDefault("minSdkVersion")
    // targetSdk is deprecated for library modules in AGP 8+; the app's value applies.
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      // The generated codegen dir is added by the com.facebook.react plugin.
      java.srcDirs += ["src/main/java"]
    }
  }
}

// `kotlinOptions {}` is an error in Kotlin 2.2; use compilerOptions instead.
kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

// The codegen task reads jsSrcsDir, name, and android.javaPackageName from package.json
// `codegenConfig` first; these values only matter if that config is missing.
react {
  jsRootDir = file("../src/")
  libraryName = "RNUnifiedLoggerSpec"
  codegenJavaPackageName = "com.unifiedlogger"
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Version comes from the React Native Gradle plugin's dependency substitution.
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault('kotlinVersion')}"
}
